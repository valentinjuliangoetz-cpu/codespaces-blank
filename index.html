<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Ascend — RPG Tracker</title>
<style>
  body {
    background: radial-gradient(circle at center, #050510 0%, #000 100%);
    font-family: "Poppins", sans-serif;
    color: #e0e0ff;
    text-align: center;
    margin: 0;
    padding: 20px;
  }

  h1 {
    color: gold;
    text-shadow: 0 0 15px gold;
  }

  #xpDisplay { margin: 8px; font-size: 1.1em; }
  #levelDisplay { color: cyan; margin-bottom: 20px; }

  /* Avatar container */
  #avatarContainer {
    position: relative;
    width: 250px;
    height: 300px;
    margin: 0 auto;
  }

  .aura {
    position: absolute;
    top: -30px;
    left: -30px;
    width: 310px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,0.5), transparent 70%);
    filter: blur(40px);
    z-index: -1;
    transition: all 0.6s ease;
  }

  /* Avatar body built with divs */
  .avatar {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
  }

  .head {
    width: 80px;
    height: 80px;
    background: #fcd7b8;
    border-radius: 50% 50% 40% 40%;
    margin: 0 auto;
    position: relative;
    z-index: 3;
  }

  .hair {
    position: absolute;
    top: -15px;
    left: 0;
    width: 80px;
    height: 40px;
    background: linear-gradient(135deg, #ffe600 0%, #ffdd00 50%, #ffd700 100%);
    clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
    border-radius: 10px 10px 0 0;
    transform: skew(-10deg);
  }

  .eyes {
    position: absolute;
    top: 35px;
    left: 15px;
    width: 50px;
    display: flex;
    justify-content: space-between;
  }

  .eye {
    width: 10px;
    height: 10px;
    background: #00aaff;
    border-radius: 50%;
  }

  .body {
    width: 120px;
    height: 130px;
    background: #111;
    border-radius: 60px / 90px;
    margin: 0 auto;
    position: relative;
    top: -5px;
  }

  .arm {
    position: absolute;
    width: 40px;
    height: 80px;
    background: #fcd7b8;
    border-radius: 20px;
    top: 20px;
    transform-origin: top;
  }

  .left-arm { left: -35px; transform: rotate(10deg); }
  .right-arm { right: -35px; transform: rotate(-10deg); }

  .pants {
    width: 120px;
    height: 80px;
    background: #1e90ff;
    border-radius: 10px 10px 0 0;
    position: relative;
    margin: 0 auto;
    top: -20px;
  }

  /* Animations */
  .pulse {
    animation: auraPulse 1.5s infinite alternate;
  }

  @keyframes auraPulse {
    from { filter: blur(30px) brightness(1); }
    to { filter: blur(40px) brightness(1.5); }
  }

  .flex {
    animation: flexPose 0.8s ease-in-out;
  }

  @keyframes flexPose {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.1) rotate(-3deg); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* Task list */
  .task-list {
    width: 90%;
    max-width: 400px;
    margin: 20px auto;
    text-align: left;
  }
  .task {
    background: #0d0d18;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 0 8px rgba(255,255,255,0.1);
  }
  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: cyan;
  }

  #addTaskForm {
    margin-top: 20px;
  }
  #addTaskForm input {
    padding: 6px 8px;
    border-radius: 6px;
    border: none;
    margin-right: 5px;
  }
  #addTaskForm button {
    background: cyan;
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Aura Ascend</h1>
  <div id="xpDisplay">XP: 0</div>
  <div id="levelDisplay">Level: 1</div>

  <div id="avatarContainer">
    <div class="aura" id="aura"></div>
    <div class="avatar" id="avatar">
      <div class="head">
        <div class="hair"></div>
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
      </div>
      <div class="body">
        <div class="arm left-arm"></div>
        <div class="arm right-arm"></div>
      </div>
      <div class="pants"></div>
    </div>
  </div>

  <div class="task-list" id="taskList"></div>

  <form id="addTaskForm">
    <input type="text" id="newTaskName" placeholder="New task..." required>
    <input type="number" id="newTaskXP" placeholder="XP" min="1" max="1000" required>
    <button type="submit">Add Task</button>
  </form>

<script>
const defaultTasks = [
  {name:"No Fap", xp:10},
  {name:"Workout", xp:15},
  {name:"Talk to a Girl", xp:10},
  {name:"Cold Shower", xp:5},
  {name:"Meditation", xp:5}
];
let xp = parseInt(localStorage.getItem('xp')) || 0;
let tasks = JSON.parse(localStorage.getItem('tasks')) || [...defaultTasks];
let lastReset = localStorage.getItem('lastReset');

function updateDisplay(){
  const level = Math.floor(xp/100)+1;
  document.getElementById('xpDisplay').innerText=`XP: ${xp}`;
  document.getElementById('levelDisplay').innerText=`Level: ${level}`;
  const aura=document.getElementById('aura');
  const avatar=document.getElementById('avatar');
  if(xp<200){
    aura.style.background="radial-gradient(circle, rgba(120,120,120,0.3), transparent 70%)";
  }else if(xp<1000){
    aura.style.background="radial-gradient(circle, rgba(255,215,0,0.6), transparent 70%)";
  }else if(xp<5000){
    aura.style.background="radial-gradient(circle, rgba(0,255,255,0.6), transparent 70%)";
  }else{
    aura.style.background="radial-gradient(circle, rgba(0,150,255,0.8), transparent 70%)";
  }
  aura.classList.add("pulse");
}

function addXP(amount){
  xp+=amount;
  localStorage.setItem('xp',xp);
  updateDisplay();
  const avatar=document.getElementById('avatar');
  avatar.classList.add("flex");
  setTimeout(()=>avatar.classList.remove("flex"),800);
}

function renderTasks(){
  const list=document.getElementById('taskList');
  list.innerHTML='';
  tasks.slice(0,5).forEach((t,i)=>{
    const div=document.createElement('div');
    div.className='task';
    div.innerHTML=`<label>${t.name}</label><input type="checkbox" data-idx="${i}" data-xp="${t.xp}">`;
    list.appendChild(div);
  });
  document.querySelectorAll('input[type="checkbox"]').forEach(box=>{
    box.addEventListener('change',e=>{
      if(e.target.checked){
        const gain=parseInt(e.target.dataset.xp);
        const idx=parseInt(e.target.dataset.idx);
        addXP(gain);
        tasks.splice(idx,1);
        localStorage.setItem('tasks',JSON.stringify(tasks));
        renderTasks();
      }
    });
  });
}

function resetTasks(){
  const now=Date.now();
  if(!lastReset || now-parseInt(lastReset)>(24*60*60*1000)){
    tasks=[...defaultTasks];
    localStorage.setItem('tasks',JSON.stringify(tasks));
    localStorage.setItem('lastReset',now);
  }
}

document.getElementById('addTaskForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('newTaskName').value.trim();
  const xpVal=parseInt(document.getElementById('newTaskXP').value);
  if(name && xpVal>0){
    tasks.push({name:name,xp:xpVal});
    localStorage.setItem('tasks',JSON.stringify(tasks));
    renderTasks();
    e.target.reset();
  }
});

resetTasks();
updateDisplay();
renderTasks();
</script>
</body>
</html>
