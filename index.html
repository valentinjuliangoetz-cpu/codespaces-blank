<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aura Ascend — RPG Checklist</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050510" />
<style>
  :root{
    --bg:#050510; --panel:#0d0d18; --ink:#e0e0ff;
    --line:#1b2350; --cyan:#7afcff; --gold:#ffd700;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(circle at center,#050510 0%,#000 100%);
    color:var(--ink); font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    text-align:center; padding:20px;
  }
  h1{margin:0 0 6px; color:var(--gold); text-shadow:0 0 15px var(--gold)}
  #hud{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:8px}
  .chip{background:#0f1122; border:1px solid var(--line); padding:6px 10px; border-radius:10px; font-size:.95rem}
  #xpDisplay{font-weight:600}
  #levelDisplay{color:var(--cyan)}
  #streakDisplay b{color:#66ffb2}
  #resetInfo{opacity:.85; font-size:.9rem; margin-bottom:16px}
  #installBtn{background:var(--cyan); color:#000; border:none; padding:6px 10px; border-radius:10px; font-weight:700; cursor:pointer}

  /* Avatar + aura + progress ring */
  #avatarContainer{position:relative; width:260px; height:320px; margin:0 auto 16px}
  .ring-wrap{position:absolute; top:-16px; left:-16px; width:292px; height:292px; pointer-events:none}
  .ring-track{fill:none; stroke:#1b2350; stroke-width:10; opacity:.7}
  .ring-progress{fill:none; stroke:var(--cyan); stroke-width:10; stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset .5s ease, stroke .5s ease;
    filter:drop-shadow(0 0 6px rgba(122,252,255,.35))}
  .aura{position:absolute; top:-34px; left:-34px; width:328px; height:388px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,0,.55),transparent 70%);
    filter:blur(40px); z-index:-1; transition:all .6s ease}
  .avatar{position:absolute; bottom:0; left:50%; transform:translateX(-50%)}
  .head{width:86px; height:86px; background:#fcd7b8; border-radius:50% 50% 40% 40%; margin:0 auto; position:relative; z-index:3}
  .hair{position:absolute; top:-16px; left:0; width:86px; height:44px; border-radius:12px 12px 0 0;
    background:linear-gradient(135deg,#ffe600 0%,#ffdd00 50%,#ffd700 100%);
    clip-path:polygon(0 0,100% 0,85% 100%,15% 100%); transform:skew(-10deg)}
  .eyes{position:absolute; top:38px; left:18px; width:52px; display:flex; justify-content:space-between}
  .eye{width:11px; height:11px; background:#00aaff; border-radius:50%}
  .body{width:130px; height:138px; background:#111; border-radius:65px/95px; margin:0 auto; position:relative; top:-4px}
  .arm{position:absolute; width:44px; height:84px; background:#fcd7b8; border-radius:22px; top:22px; transform-origin:top}
  .left-arm{left:-38px; transform:rotate(10deg)}
  .right-arm{right:-38px; transform:rotate(-10deg)}
  .pants{width:130px; height:86px; background:#1e90ff; border-radius:12px 12px 0 0; position:relative; margin:0 auto; top:-18px}
  .pulse{animation:auraPulse 1.6s infinite alternate}
  @keyframes auraPulse{from{filter:blur(28px) brightness(1)} to{filter:blur(42px) brightness(1.5)}}
  .flex{animation:flexPose .8s ease-in-out}
  @keyframes flexPose{0%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.1) rotate(-3deg)} 100%{transform:translateX(-50%) scale(1)}}

  /* Layout panels */
  .wrap{width:96%; max-width:1080px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:16px}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:left; box-shadow:0 0 12px rgba(255,255,255,.06)}
  .panel h3{margin:0 0 8px; color:var(--cyan)}
  .sectionTitle{margin:8px 0 6px; color:var(--gold); font-weight:800}

  /* Checklist styling */
  .checklist{margin:6px 0 14px}
  .checklist h4{margin:14px 0 8px; color:#9bc9ff}
  .item{display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-bottom:1px dashed #202a60}
  .item:last-child{border-bottom:none}
  .item input[type="checkbox"]{margin-top:2px; width:18px; height:18px; accent-color:var(--cyan)}
  .item label{flex:1; line-height:1.3}
  .item.done label{opacity:.55; text-decoration:line-through}
  .badge{font-size:.72rem; padding:2px 6px; border-radius:999px; border:1px solid #2a3580; background:#0c1030; color:#9bc9ff; margin-left:6px}

  /* Achievements */
  .achievements-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:8px; background:#0f1122; border:1px solid #202a60; border-radius:10px; padding:10px}
  .trophy{font-size:28px; display:grid; place-items:center; width:100%; aspect-ratio:1/1; background:#0c1025; border-radius:10px; border:1px solid #1b2350}
  .empty-note{opacity:.75; font-size:.95rem; padding:10px}
</style>
</head>
<body>
  <h1>Aura Ascend</h1>

  <div id="hud">
    <div id="xpDisplay" class="chip">XP: 0</div>
    <div id="levelDisplay" class="chip">Level: 1</div>
    <div id="streakDisplay" class="chip">🔥 Streak: <b>0</b> days</div>
    <div id="resetInfo" class="chip">Resets daily at <b>06:00</b> • Next: <span id="nextReset">–</span></div>
    <button id="installBtn" style="display:none">Install App</button>
  </div>

  <div id="avatarContainer">
    <svg class="ring-wrap" viewBox="0 0 120 120">
      <circle class="ring-track" cx="60" cy="60" r="52"></circle>
      <circle id="ringProgress" class="ring-progress" cx="60" cy="60" r="52"
              stroke-dasharray="326.7256" stroke-dashoffset="326.7256"></circle>
    </svg>
    <div class="aura pulse" id="aura"></div>
    <div class="avatar" id="avatar">
      <div class="head"><div class="hair"></div>
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      </div>
      <div class="body"><div class="arm left-arm"></div><div class="arm right-arm"></div></div>
      <div class="pants"></div>
    </div>
  </div>

  <div class="wrap">
    <!-- LEFT: Daily Energy Checklists -->
    <div class="panel">
      <h3>Daily Energy Checklists — (+10 XP each)</h3>
      <div id="checklists" class="checklist"></div>
    </div>

    <!-- RIGHT: Fear Challenge + Achievements -->
    <div class="panel">
      <h3>Fear Challenge of the Day — (+50 XP)</h3>
      <div id="fearChallenge" class="checklist"></div>

      <h3 class="sectionTitle">Achievements</h3>
      <div id="achievements" class="achievements-grid"></div>
      <div id="noAch" class="empty-note" style="display:none;">Level up to earn random trophies 🏆</div>
    </div>
  </div>

<script>
/* =========================
   DATA
========================= */
const TEN = 10;           // xp per checklist item
const FEAR_XP = 50;       // xp for fear task

// 8 categories with exact items (each item = +10 XP)
const CHECKLIST = [
  { cat: "Sexual Energy (Drive, magnetism, confidence)", items: [
    "No porn, no mindless arousal",
    "Practice self-control (no fap, or conscious moderation)",
    "5–10 minutes of deep belly breathing (energy circulation)",
    "1 minute of cold water exposure (increases vitality)",
    "Flirt naturally or express confident energy in social settings",
    "Grounding walk barefoot / sun exposure on skin"
  ]},
  { cat: "Physical Energy (Strength, stamina, vitality)", items: [
    "Complete one workout or at least 20 minutes of movement",
    "Stretch or mobility work for 10 minutes",
    "10,000+ steps or one long walk",
    "Cold shower or cold rinse",
    "Stay hydrated (2–3 L water)",
    "Eat a clean, protein-rich meal"
  ]},
  { cat: "Mental Energy (Focus, clarity, discipline)", items: [
    "Meditate 10–20 minutes (focus or awareness)",
    "Read 10 pages of a valuable book",
    "Plan your day and top 3 priorities",
    "Work 25+ minutes in full focus (no phone, no distractions)",
    "Journal 5 minutes about insights or thoughts"
  ]},
  { cat: "Social Energy (Connection, charisma, leadership)", items: [
    "Start 1 new conversation (in person or online)",
    "Compliment or encourage someone genuinely",
    "Text or call a friend/family member",
    "Smile and make eye contact with people you see",
    "Offer help or value to someone with no expectation"
  ]},
  { cat: "Spiritual Energy (Meaning, peace, intuition)", items: [
    "5–10 minutes of prayer, gratitude, or reflection",
    "Write down 3 things you’re grateful for",
    "Spend 5+ minutes in silence or nature",
    "Do one act of kindness or service",
    "Observe your emotions without judgment"
  ]},
  { cat: "Creative Energy (Flow, inspiration, expression)", items: [
    "Create something (art, writing, video, design, etc.)",
    "Brainstorm new ideas for your craft or business",
    "Spend 15 minutes learning or practicing a skill",
    "Share something publicly (story, insight, creation)",
    "Try one new thing or perspective today"
  ]},
  { cat: "Nutritional Energy (Fuel, hormones, recovery)", items: [
    "Eat a high-protein meal (no junk)",
    "Eat slow, mindfully, with gratitude",
    "Get sunlight before noon",
    "Limit sugar, alcohol, and processed foods",
    "Take essential vitamins (if needed)"
  ]},
  { cat: "Recovery / Sleep Energy (Regeneration, balance)", items: [
    "Avoid screens 1 hour before bed",
    "Sleep 7–8 hours minimum",
    "Stretch or deep breathe before bed",
    "Keep bedroom cool, dark, and silent",
    "No caffeine after 2 p.m."
  ]}
];

// Fear challenge pool — one shown per day
const FEAR_POOL = [
  "Speak your truth even if your voice shakes",
  "Approach someone attractive and start a conversation",
  "Do a 2-minute cold shower or ice bath",
  "Ask for something you want (promotion, favor, help)",
  "Share your honest opinion online",
  "Record yourself talking confidently and post it",
  "Ask for a small discount in a shop (politely)",
  "Start a conversation with someone you admire",
  "Ask for constructive feedback on your work",
  "Lead a group warm-up at the gym",
  "Sing or speak confidently in a public space for 60 seconds",
  "30-minute solo walk without phone or music"
];

/* =========================
   PERSISTENT STATE
========================= */
let xp = parseInt(localStorage.getItem('xp') || "0", 10);
let trophies = JSON.parse(localStorage.getItem('trophies') || "[]");
let savedCycleKey = localStorage.getItem('cycleKey');             // identifies the current day-cycle (6AM based)
let completed = JSON.parse(localStorage.getItem('completed') || "{}"); // { [cycleKey]: { id:true } }
let fearForKey = JSON.parse(localStorage.getItem('fearForKey') || "{}"); // { [cycleKey]: index }

/* Streak state */
let streak = parseInt(localStorage.getItem('streak') || "0", 10);
let streakLastIncrementKey = localStorage.getItem('streakLastIncrementKey') || null; // last cycle we incremented on

/* =========================
   TIME / RESET AT 06:00
========================= */
function getToday6am(date=new Date()){
  const d = new Date(date);
  d.setHours(6,0,0,0);
  return d;
}
function cycleKeyFromDate(d){
  return d.toISOString().slice(0,10)+"-06:00";
}
function getCycleKey(now=new Date()){
  const today6 = getToday6am(now);
  if (now < today6) {
    const y = new Date(today6); y.setDate(y.getDate()-1);
    return cycleKeyFromDate(y);
  }
  return cycleKeyFromDate(today6);
}
function getNextResetTime(now=new Date()){
  const today6 = getToday6am(now);
  return (now < today6) ? today6 : new Date(today6.getTime() + 24*60*60*1000);
}
function prevCycleKeyOf(key){
  // key format: YYYY-MM-DD-06:00
  const parts = key.split("-"); // [YYYY, MM, DD, "06:00"]
  const d = new Date(parts[0]+"-"+parts[1]+"-"+parts[2]+"T06:00:00");
  const prev = new Date(d.getTime() - 24*60*60*1000);
  return cycleKeyFromDate(prev);
}

function ensureCycle(){
  const now = new Date();
  const key = getCycleKey(now);

  if (savedCycleKey !== key){
    // on day change, if we did NOT increment streak yesterday, streak resets
    if (savedCycleKey){ // only if not first run
      const prevKey = savedCycleKey;        // yesterday's cycle
      if (streakLastIncrementKey !== prevCycleKeyOf(key)) {
        // you missed yesterday (no first task), reset streak
        streak = 0;
        localStorage.setItem('streak', String(streak));
      }
    }

    savedCycleKey = key;
    localStorage.setItem('cycleKey', savedCycleKey);

    // init completed map for this key
    completed[savedCycleKey] = {};
    localStorage.setItem('completed', JSON.stringify(completed));

    // pick fear challenge deterministically for this cycle
    const idx = seededIndex(FEAR_POOL.length, savedCycleKey);
    fearForKey[savedCycleKey] = idx;
    localStorage.setItem('fearForKey', JSON.stringify(fearForKey));
  }

  // update “next reset” label
  const next = getNextResetTime(now);
  document.getElementById('nextReset').textContent = next.toLocaleString();
}
setInterval(()=>{ ensureCycle(); renderHUDOnly(); }, 60*1000); // check each minute

/* =========================
   RANDOM (deterministic for the day key)
========================= */
function hashString32(s){
  let h = 2166136261 >>> 0;
  for (let i=0; i<s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function seededIndex(n, seedStr){
  const x = hashString32(seedStr);
  return x % n;
}

/* =========================
   LEVEL / RING / AURA / HUD
========================= */
const R = 52, CIRC = 2*Math.PI*R;
const ring = document.getElementById('ringProgress');
ring.setAttribute('stroke-dasharray', CIRC);

function getLevel(x){ return Math.floor(x/100) + 1; }

function updateRing(){
  const progress = (xp % 100) / 100;
  ring.style.strokeDashoffset = String(CIRC * (1 - progress));
  ring.style.stroke = progress < .33 ? '#7afcff' : progress < .66 ? '#ffd700' : '#00a3ff';
}
function updateHUD(){
  document.getElementById('xpDisplay').textContent = `XP: ${xp}`;
  document.getElementById('levelDisplay').textContent = `Level: ${getLevel(xp)}`;
  document.getElementById('streakDisplay').innerHTML = `🔥 Streak: <b>${streak}</b> days`;

  // aura intensity
  const aura = document.getElementById('aura');
  aura.style.background = xp<200 ? "radial-gradient(circle,rgba(120,120,120,.3),transparent 70%)"
    : xp<1000 ? "radial-gradient(circle,rgba(255,215,0,.6),transparent 70%)"
    : xp<5000 ? "radial-gradient(circle,rgba(0,255,255,.6),transparent 70%)"
              : "radial-gradient(circle,rgba(0,150,255,.85),transparent 70%)";
  updateRing();
}
function addXP(amount){
  const prevLvl = getLevel(xp);
  xp += amount;
  localStorage.setItem('xp', String(xp));
  updateHUD();

  // flex animation
  const av = document.getElementById('avatar');
  av.classList.add('flex');
  setTimeout(()=> av.classList.remove('flex'), 800);

  // level-up trophy
  const newLvl = getLevel(xp);
  if (newLvl > prevLvl) awardTrophy(newLvl);
}

/* =========================
   STREAK: increment on first completion each day
========================= */
function maybeIncrementStreak(){
  if (streakLastIncrementKey !== savedCycleKey){
    streak += 1;
    streakLastIncrementKey = savedCycleKey;
    localStorage.setItem('streak', String(streak));
    localStorage.setItem('streakLastIncrementKey', streakLastIncrementKey);
    updateHUD();
  }
}

/* =========================
   ACHIEVEMENTS
========================= */
const TROPHY_POOL = ["🏆","💎","🔥","⚡️","🌟","🧠","💪","🛡️","🏹","🦁","🐉","🦅","🌙","☀️","🌈","🎯","🏔️","🚀","👑","🎖️","🥇","🥈","🥉","🪙","🧿"];
function awardTrophy(level){
  const emoji = TROPHY_POOL[Math.floor(Math.random()*TROPHY_POOL.length)];
  trophies.push({ emoji, level, ts: Date.now() });
  localStorage.setItem('trophies', JSON.stringify(trophies));
  renderAchievements();
}
function renderAchievements(){
  const grid = document.getElementById('achievements');
  const empty = document.getElementById('noAch');
  grid.innerHTML = "";
  if (!trophies.length){ empty.style.display = "block"; return; }
  empty.style.display = "none";
  trophies.forEach(t=>{
    const d = document.createElement('div');
    d.className = "trophy";
    d.title = `Level ${t.level}`;
    d.textContent = t.emoji;
    grid.appendChild(d);
  });
}

/* =========================
   RENDER CHECKLISTS
========================= */
function itemId(catIndex, itemIndex){ return `${catIndex}:${itemIndex}`; }

function renderChecklists(){
  const container = document.getElementById('checklists');
  container.innerHTML = "";
  CHECKLIST.forEach((group, ci)=>{
    const h4 = document.createElement('h4');
    h4.textContent = group.cat;
    container.appendChild(h4);

    group.items.forEach((text, ii)=>{
      const id = itemId(ci, ii);
      const row = document.createElement('div');
      row.className = "item";

      const checked = !!(completed[savedCycleKey] && completed[savedCycleKey][id]);
      row.innerHTML = `
        <input type="checkbox" id="chk-${id}" ${checked ? "checked disabled" : ""}>
        <label for="chk-${id}">${text}</label>
        <span class="badge">+${TEN} XP</span>
      `;
      if (checked) row.classList.add('done');

      row.querySelector('input').addEventListener('change', (e)=>{
        if (e.target.checked){
          // award XP & mark completed for this cycle
          addXP(TEN);
          completed[savedCycleKey] = completed[savedCycleKey] || {};
          completed[savedCycleKey][id] = true;
          localStorage.setItem('completed', JSON.stringify(completed));
          e.target.disabled = true;
          row.classList.add('done');
          // streak logic
          maybeIncrementStreak();
        }
      });

      container.appendChild(row);
    });
  });
}

function renderFear(){
  const box = document.getElementById('fearChallenge');
  box.innerHTML = "";
  const idx = fearForKey[savedCycleKey];
  const text = FEAR_POOL[idx];
  const row = document.createElement('div');
  row.className = "item";
  const id = "fear";
  const isDone = !!(completed[savedCycleKey] && completed[savedCycleKey][id]);

  row.innerHTML = `
    <input type="checkbox" id="fearbox" ${isDone ? "checked disabled" : ""}>
    <label for="fearbox">${text}</label>
    <span class="badge">+${FEAR_XP} XP</span>
  `;
  if (isDone) row.classList.add('done');
  row.querySelector('input').addEventListener('change', (e)=>{
    if (e.target.checked){
      addXP(FEAR_XP);
      completed[savedCycleKey] = completed[savedCycleKey] || {};
      completed[savedCycleKey][id] = true;
      localStorage.setItem('completed', JSON.stringify(completed));
      e.target.disabled = true;
      row.classList.add('done');
      // streak logic
      maybeIncrementStreak();
    }
  });
  box.appendChild(row);
}

/* =========================
   RENDER (HUD-only updates for timer)
========================= */
function renderAll(){
  ensureCycle();
  renderChecklists();
  renderFear();
  renderAchievements();
  updateHUD();
}
function renderHUDOnly(){
  const next = getNextResetTime(new Date());
  document.getElementById('nextReset').textContent = next.toLocaleString();
  updateHUD();
}

/* =========================
   PWA: Service Worker + Install
========================= */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=> {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  btn.style.display = 'inline-block';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});

/* =========================
   BOOT
========================= */
renderAll();
</script>
<!-- === ADD-ON: Daily Summary + Progress Chart === -->
<!-- Chart.js library (lightweight CDN) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  /* Stats modal + button */
  #statsBtn {
    background: var(--cyan); color:#000; border:none;
    border-radius:8px; padding:6px 12px; font-weight:700; cursor:pointer;
    margin-top:6px;
  }
  dialog#statsDialog {
    border:none; border-radius:12px; background:#0d0d18; color:var(--ink);
    width:90%; max-width:700px; padding:16px;
  }
  #summaryPopup {
    position:fixed; bottom:20px; right:20px; z-index:999;
    background:#0f1122; border:1px solid #202a60; border-radius:10px;
    padding:14px 18px; color:#e0e0ff; box-shadow:0 0 12px rgba(0,0,0,.6);
    display:none; max-width:260px; text-align:left;
  }
  #summaryPopup b{color:var(--gold)}
  #summaryPopup button{margin-top:8px;background:var(--cyan);color:#000;border:none;border-radius:8px;padding:4px 10px;cursor:pointer}
</style>

<!-- Button to open stats -->
<button id="statsBtn">📊 Stats</button>

<!-- Chart modal -->
<dialog id="statsDialog">
  <h3>Progress Stats</h3>
  <canvas id="xpChart" height="180"></canvas>
  <canvas id="streakChart" height="180" style="margin-top:20px;"></canvas>
  <button onclick="document.getElementById('statsDialog').close()">Close</button>
</dialog>

<!-- Daily summary popup -->
<div id="summaryPopup"></div>

<script>
/* =========================
   DAILY SUMMARY + STATS CHART
========================= */

// We'll reuse existing variables: xp, streak, savedCycleKey, completed

// History structure in localStorage
let history = JSON.parse(localStorage.getItem('history') || "[]");

// Called at day rollover (after ensureCycle detects new key)
function recordYesterdaySummary(prevKey) {
  if (!prevKey || !completed[prevKey]) return;
  const tasksDone = Object.keys(completed[prevKey]).length;
  const prevXP = parseInt(localStorage.getItem('xpPrev') || "0",10);
  const currXP = xp;
  const gained = Math.max(currXP - prevXP, 0);
  const entry = {
    key: prevKey,
    date: prevKey.split("-")[0],
    gained,
    tasks: tasksDone,
    streak
  };
  history.push(entry);
  if (history.length > 60) history.shift(); // keep last 60 days
  localStorage.setItem('history', JSON.stringify(history));
  localStorage.setItem('xpPrev', String(currXP));
  showSummaryPopup(entry);
}

// Display small popup bottom-right
function showSummaryPopup(entry){
  const box=document.getElementById('summaryPopup');
  box.innerHTML=`<b>Yesterday</b><br>
    Tasks Done: ${entry.tasks}<br>
    XP Gained: ${entry.gained}<br>
    Current Streak: ${entry.streak}<br>
    <button onclick="this.parentElement.style.display='none'">OK</button>`;
  box.style.display='block';
  setTimeout(()=>box.style.display='none',15000);
}

// Hook into your existing ensureCycle()
// We override it lightly to call recordYesterdaySummary
const oldEnsureCycle = ensureCycle;
ensureCycle = function(){
  const now = new Date();
  const oldKey = savedCycleKey;
  oldEnsureCycle(); // run original
  // if a new day started, oldKey != savedCycleKey
  if (oldKey && oldKey !== savedCycleKey) recordYesterdaySummary(oldKey);
};

// --- Stats modal logic ---
document.getElementById('statsBtn').addEventListener('click', ()=>{
  renderCharts();
  document.getElementById('statsDialog').showModal();
});

function renderCharts(){
  const ctx1=document.getElementById('xpChart');
  const ctx2=document.getElementById('streakChart');
  const dates=history.map(h=>h.date);
  const xps=history.map(h=>h.gained);
  const strs=history.map(h=>h.streak);

  if(window.xpChartObj){window.xpChartObj.destroy();window.streakChartObj.destroy();}
  window.xpChartObj=new Chart(ctx1,{
    type:'line',
    data:{labels:dates,datasets:[{label:'XP Gained',data:xps,borderColor:'#ffd700',fill:false,tension:.3}]},
    options:{scales:{x:{ticks:{color:'#9bc9ff'}},y:{ticks:{color:'#9bc9ff'}}}}
  });
  window.streakChartObj=new Chart(ctx2,{
    type:'line',
    data:{labels:dates,datasets:[{label:'Streak',data:strs,borderColor:'#66ffb2',fill:false,tension:.3}]},
    options:{scales:{x:{ticks:{color:'#9bc9ff'}},y:{ticks:{color:'#9bc9ff'}}}}
  });
}
</script>
</body>
</html>
