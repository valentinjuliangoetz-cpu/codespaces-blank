<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura Ascend — RPG Tracker</title>
<style>
  body{
    background:radial-gradient(circle at center,#050510 0%,#000 100%);
    font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:#e0e0ff;text-align:center;margin:0;padding:20px;
  }
  h1{color:gold;text-shadow:0 0 15px gold;margin:0 0 6px}
  #xpDisplay{margin:4px;font-size:1.05rem}
  #levelDisplay{color:cyan;margin-bottom:12px}
  #resetInfo{opacity:.8;font-size:.9rem;margin-bottom:14px}

  /* Avatar + aura + ring */
  #avatarContainer{position:relative;width:260px;height:320px;margin:0 auto 14px}
  .ring-wrap{position:absolute;top:-16px;left:-16px;width:292px;height:292px;pointer-events:none}
  .ring-track{fill:none;stroke:#1b2350;stroke-width:10;opacity:.7}
  .ring-progress{fill:none;stroke:#7afcff;stroke-width:10;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;
    transition:stroke-dashoffset .5s ease,stroke .5s ease;
    filter:drop-shadow(0 0 6px rgba(122,252,255,.35));
  }
  .aura{position:absolute;top:-34px;left:-34px;width:328px;height:388px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,0,.5),transparent 70%);
    filter:blur(40px);z-index:-1;transition:all .6s ease;}
  .avatar{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
  .head{width:86px;height:86px;background:#fcd7b8;border-radius:50% 50% 40% 40%;
    margin:0 auto;position:relative;z-index:3}
  .hair{position:absolute;top:-16px;left:0;width:86px;height:44px;
    background:linear-gradient(135deg,#ffe600 0%,#ffdd00 50%,#ffd700 100%);
    clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);border-radius:12px 12px 0 0;transform:skew(-10deg)}
  .eyes{position:absolute;top:38px;left:18px;width:52px;display:flex;justify-content:space-between}
  .eye{width:11px;height:11px;background:#00aaff;border-radius:50%}
  .body{width:130px;height:138px;background:#111;border-radius:65px/95px;margin:0 auto;position:relative;top:-4px}
  .arm{position:absolute;width:44px;height:84px;background:#fcd7b8;border-radius:22px;top:22px;transform-origin:top}
  .left-arm{left:-38px;transform:rotate(10deg)}
  .right-arm{right:-38px;transform:rotate(-10deg)}
  .pants{width:130px;height:86px;background:#1e90ff;border-radius:12px 12px 0 0;
    position:relative;margin:0 auto;top:-18px}
  .pulse{animation:auraPulse 1.6s infinite alternate}
  @keyframes auraPulse{from{filter:blur(28px) brightness(1)}to{filter:blur(42px) brightness(1.5)}}
  .flex{animation:flexPose .8s ease-in-out}
  @keyframes flexPose{0%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.1) rotate(-3deg)}
    100%{transform:translateX(-50%) scale(1)}}

  /* Panels */
  .wrap{width:96%;max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:860px){.wrap{grid-template-columns:1fr 1fr}}
  .panel{background:#0d0d18;border:1px solid #1b2350;border-radius:12px;
    padding:14px;text-align:left;box-shadow:0 0 12px rgba(255,255,255,.06)}
  .panel h3{margin:0 0 8px;color:#7afcff}

  /* Task list grid */
  .task-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media(max-width:600px){.task-grid{grid-template-columns:1fr}}
  .task{
    background:#0f1122;border:1px solid #202a60;padding:8px 10px;
    border-radius:8px;display:flex;justify-content:space-between;align-items:center;
  }
  .task label{flex:1;font-size:.95rem}
  input[type="checkbox"]{width:18px;height:18px;accent-color:cyan}
  .hint{opacity:.8;font-size:.9rem;margin:2px 0 8px}

  /* Add task form */
  #addTaskForm{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  #addTaskForm input{padding:8px 10px;border-radius:8px;border:none;outline:none;background:#0e1130;color:#e0e0ff}
  #addTaskForm button{background:cyan;color:#000;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}

  /* Achievements */
  .achievements-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;
    background:#0f1122;border:1px solid #202a60;border-radius:10px;padding:10px;
  }
  .trophy{font-size:28px;display:grid;place-items:center;width:100%;aspect-ratio:1/1;
    background:#0c1025;border-radius:10px;border:1px solid #1b2350}
  .empty-note{opacity:.75;font-size:.95rem;padding:10px}
</style>
</head>
<body>
<h1>Aura Ascend</h1>
<div id="xpDisplay">XP: 0</div>
<div id="levelDisplay">Level: 1</div>
<div id="resetInfo">Tasks reset every <b>12 hours</b>. Next reset: <span id="nextReset">–</span></div>

<div id="avatarContainer">
  <svg class="ring-wrap" viewBox="0 0 120 120">
    <circle class="ring-track" cx="60" cy="60" r="52"></circle>
    <circle id="ringProgress" class="ring-progress" cx="60" cy="60" r="52"
      stroke-dasharray="326.73" stroke-dashoffset="326.73"></circle>
  </svg>
  <div class="aura pulse" id="aura"></div>
  <div class="avatar" id="avatar">
    <div class="head"><div class="hair"></div>
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
    </div>
    <div class="body"><div class="arm left-arm"></div><div class="arm right-arm"></div></div>
    <div class="pants"></div>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <h3>Daily Tasks</h3>
    <div class="hint">Each gives <b>10 XP</b> across sexual, physical, mental, social, spiritual, creative, nutrition & sleep energies.</div>
    <div id="taskList" class="task-grid"></div>
    <form id="addTaskForm">
      <input type="text" id="newTaskName" placeholder="Add custom task…" required>
      <input type="number" id="newTaskXP" placeholder="XP" min="1" max="1000" value="10" required>
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="panel">
    <h3>Achievements</h3>
    <div id="achievements" class="achievements-grid"></div>
    <div id="noAch" class="empty-note" style="display:none;">Level up to earn random trophies 🏆</div>
  </div>
</div>

<script>
const RESET_INTERVAL_MS=12*60*60*1000;
const defaultTasks=[
  {name:"No Fap today",xp:10},{name:"No porn consumed",xp:10},{name:"Breathwork 3×1 min",xp:10},{name:"Flirt / social warm-up",xp:10},
  {name:"Workout / Boxing",xp:10},{name:"Stretch 10 min",xp:10},{name:"10 000 steps / walk",xp:10},{name:"Cold shower",xp:10},
  {name:"Meditate 20 min",xp:10},{name:"Deep focus 25 min",xp:10},{name:"Read 10 pages",xp:10},
  {name:"Talk to a stranger",xp:10},{name:"Message a friend",xp:10},
  {name:"Gratitude journal",xp:10},{name:"Prayer / reflection",xp:10},
  {name:"Creative practice 15 min",xp:10},
  {name:"High-protein meal",xp:10},{name:"Drink 2 L water",xp:10},{name:"Morning sunlight 10 min",xp:10},
  {name:"No screens 1 h pre-bed",xp:10},{name:"Sleep 7+ h",xp:10}
];
let xp=parseInt(localStorage.getItem('xp'))||0;
let tasks=JSON.parse(localStorage.getItem('tasks'))||[...defaultTasks];
let lastReset=parseInt(localStorage.getItem('lastReset')||"0");
let trophies=JSON.parse(localStorage.getItem('trophies')||"[]");
const trophyPool=["🏆","💎","🔥","⚡️","🌟","🧠","💪","🛡️","🏹","🦁","🐉","🦅","🌙","☀️","🌈","🎯","🏔️","🚀","👑","🎖️"];
const R=52,CIRC=2*Math.PI*R,ring=document.getElementById('ringProgress');ring.setAttribute('stroke-dasharray',CIRC);
function getLevel(x){return Math.floor(x/100)+1}
function updateRing(){const p=(xp%100)/100;ring.style.strokeDashoffset=CIRC*(1-p);
  ring.style.stroke=p<.33?"#7afcff":p<.66?"#ffd700":"#00a3ff";}
function updateDisplay(){
  const lvl=getLevel(xp);
  document.getElementById('xpDisplay').textContent=`XP: ${xp}`;
  document.getElementById('levelDisplay').textContent=`Level: ${lvl}`;
  const aura=document.getElementById('aura');
  aura.style.background=xp<200?"radial-gradient(circle,rgba(120,120,120,.3),transparent 70%)":
    xp<1000?"radial-gradient(circle,rgba(255,215,0,.6),transparent 70%)":
    xp<5000?"radial-gradient(circle,rgba(0,255,255,.6),transparent 70%)":
             "radial-gradient(circle,rgba(0,150,255,.85),transparent 70%)";
  updateRing();
}
function addXP(v){
  const prev=getLevel(xp);xp+=v;localStorage.setItem('xp',xp);updateDisplay();
  const av=document.getElementById('avatar');av.classList.add("flex");setTimeout(()=>av.classList.remove("flex"),800);
  const lvl=getLevel(xp);if(lvl>prev){const e=trophyPool[Math.floor(Math.random()*trophyPool.length)];
    trophies.push({emoji:e,level:lvl});localStorage.setItem('trophies',JSON.stringify(trophies));renderAchievements();}
}
function renderAchievements(){
  const g=document.getElementById('achievements'),n=document.getElementById('noAch');
  g.innerHTML="";if(!trophies.length){n.style.display="block";return;}n.style.display="none";
  trophies.forEach(t=>{const d=document.createElement('div');d.className="trophy";d.title=`Level ${t.level}`;d.textContent=t.emoji;g.appendChild(d);});
}
function renderTasks(){
  const list=document.getElementById('taskList');list.innerHTML="";
  tasks.slice(0,12).forEach((t,i)=>{const d=document.createElement('div');d.className="task";
    d.innerHTML=`<label>${t.name}</label><input type='checkbox' data-idx='${i}' data-xp='${t.xp}'>`;
    list.appendChild(d);});
  list.querySelectorAll("input[type='checkbox']").forEach(box=>box.addEventListener('change',e=>{
    if(e.target.checked){addXP(+e.target.dataset.xp);tasks.splice(+e.target.dataset.idx,1);
      localStorage.setItem('tasks',JSON.stringify(tasks));renderTasks();}}));
}
function performReset(now){tasks=[...defaultTasks];localStorage.setItem('tasks',JSON.stringify(tasks));
  lastReset=now;localStorage.setItem('lastReset',now);renderTasks();}
function checkReset(){
  const now=Date.now();if(!lastReset||now-lastReset>=RESET_INTERVAL_MS)performReset(now);
  const next=new Date(lastReset+RESET_INTERVAL_MS);
  document.getElementById('nextReset').textContent=next.toLocaleString();
}
document.getElementById('addTaskForm').addEventListener('submit',e=>{
  e.preventDefault();const n=document.getElementById('newTaskName').value.trim(),x=+document.getElementById('newTaskXP').value;
  if(n&&x>0){tasks.push({name:n,xp:x});localStorage.setItem('tasks',JSON.stringify(tasks));renderTasks();e.target.reset();}});
checkReset();updateDisplay();renderTasks();renderAchievements();
</script>
</body>
</html>
