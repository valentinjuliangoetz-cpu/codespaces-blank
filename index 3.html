<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aura Ascend — Daily RPG</title>
<style>
  :root{
    --bg:#05060b;
    --panel:#0f1118;
    --muted:#b9c0ff;
    --gold:#ffd700;
    --cyan:#7afcff;
    --good:#66ffb2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Poppins', sans-serif;
    color:#e8ebff;
    background: radial-gradient(circle at center, #0a0a0f, #000);
    min-height:100vh;
    text-align:center;
    padding:20px;
  }
  h1{color:var(--gold);text-shadow:0 0 20px #ffcc00}
  #xpDisplay{margin:6px;font-size:1.1em}
  #levelDisplay{color:var(--cyan)}
  #avatarContainer{
    position:relative;
    display:inline-block;
    margin:20px auto;
  }
  #avatar{
    width:220px;
    height:auto;
    border-radius:10px;
    transition:all 0.5s ease;
  }
  .aura{
    position:absolute;
    top:-30px;left:-30px;
    width:280px;height:280px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,215,0,0.5), transparent 70%);
    filter:blur(35px);
    z-index:-1;
    transition:all 0.6s ease;
  }
  .task-list{
    width:90%;
    max-width:420px;
    margin:20px auto;
  }
  .task{
    background:var(--panel);
    border:1px solid #1b2350;
    border-radius:8px;
    padding:10px 12px;
    margin:8px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  label{flex:1;text-align:left;}
  input[type="checkbox"]{width:18px;height:18px;accent-color:var(--cyan)}
  #addTaskForm{margin-top:20px;}
  #addTaskForm input{padding:6px 8px;border-radius:6px;border:none;outline:none;margin-right:6px;}
  #addTaskForm button{
    background:var(--cyan);
    color:#000;
    border:none;
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    font-weight:bold;
  }
</style>
</head>
<body>
<h1>Aura Ascend</h1>
<div id="xpDisplay">XP: 0</div>
<div id="levelDisplay">Level: 1</div>

<div id="avatarContainer">
  <div class="aura" id="aura"></div>
  <img id="avatar" src="5B98F72E-CEFC-4D9F-A091-681A3130DDA0.jpeg" alt="Hero Avatar">
</div>

<div class="task-list" id="taskList"></div>

<form id="addTaskForm">
  <input type="text" id="newTaskName" placeholder="New task..." required>
  <input type="number" id="newTaskXP" placeholder="XP" min="1" max="1000" required>
  <button type="submit">Add Task</button>
</form>

<script>
const defaultTasks = [
  {name:"No Fap", xp:10},
  {name:"Workout", xp:15},
  {name:"Talk to a Girl", xp:10},
  {name:"Cold Shower", xp:5},
  {name:"Meditation", xp:5}
];
let xp = parseInt(localStorage.getItem('xp')) || 0;
let tasks = JSON.parse(localStorage.getItem('tasks')) || [...defaultTasks];
let lastReset = localStorage.getItem('lastReset');

function updateDisplay(){
  const level = Math.floor(xp/100)+1;
  document.getElementById('xpDisplay').innerText=`XP: ${xp}`;
  document.getElementById('levelDisplay').innerText=`Level: ${level}`;
  const aura=document.getElementById('aura');
  const avatar=document.getElementById('avatar');
  if(xp<200){
    aura.style.background="radial-gradient(circle, rgba(100,100,100,0.3), transparent 70%)";
    avatar.style.filter="grayscale(60%) brightness(0.6)";
  }else if(xp<1000){
    aura.style.background="radial-gradient(circle, rgba(255,215,0,0.5), transparent 70%)";
    avatar.style.filter="grayscale(0%) brightness(1)";
  }else if(xp<5000){
    aura.style.background="radial-gradient(circle, rgba(0,255,255,0.6), transparent 70%)";
    avatar.style.filter="brightness(1.2)";
  }else{
    aura.style.background="radial-gradient(circle, rgba(0,150,255,0.8), transparent 70%)";
    avatar.style.filter="brightness(1.4) saturate(1.2)";
  }
}

function addXP(amount){
  xp+=amount;
  localStorage.setItem('xp',xp);
  updateDisplay();
}

function renderTasks(){
  const list=document.getElementById('taskList');
  list.innerHTML='';
  tasks.slice(0,5).forEach((t,i)=>{
    const div=document.createElement('div');
    div.className='task';
    div.innerHTML=`<label>${t.name}</label><input type="checkbox" data-idx="${i}" data-xp="${t.xp}">`;
    list.appendChild(div);
  });
  document.querySelectorAll('input[type="checkbox"]').forEach(box=>{
    box.addEventListener('change',e=>{
      if(e.target.checked){
        const gain=parseInt(e.target.dataset.xp);
        const idx=parseInt(e.target.dataset.idx);
        addXP(gain);
        tasks.splice(idx,1); // remove completed
        localStorage.setItem('tasks',JSON.stringify(tasks));
        renderTasks();
      }
    });
  });
}

function resetTasks(){
  const now=Date.now();
  if(!lastReset || now-parseInt(lastReset)>(24*60*60*1000)){
    tasks=[...defaultTasks];
    localStorage.setItem('tasks',JSON.stringify(tasks));
    localStorage.setItem('lastReset',now);
  }
}

document.getElementById('addTaskForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('newTaskName').value.trim();
  const xpVal=parseInt(document.getElementById('newTaskXP').value);
  if(name && xpVal>0){
    tasks.push({name:name,xp:xpVal});
    localStorage.setItem('tasks',JSON.stringify(tasks));
    renderTasks();
    e.target.reset();
  }
});

resetTasks();
updateDisplay();
renderTasks();
</script>
</body>
</html>
